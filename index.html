<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LOVOT バルーン試作 — コアループ</title>
<style>
  :root {
    --ink:      #2b2730;              /* warm charcoal, same tone as the LOVOT's pupils */
    --cream:    #fff6ea;              /* warm cream highlight text */
    --coral:    #ff6f8e;              /* LOVOT-pink accent, matches the balloon color */
    --coral-dk: #e14f70;
    --gold:     #ffd27a;              /* warm gold accent, matches the slider thumb */
    --panel-bg: rgba(43,38,46,.92);
    --chip-bg:  rgba(43,38,46,.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--ink);
    font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Quicksand", system-ui, sans-serif;
    touch-action:none; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  #hud { position:fixed; top:calc(env(safe-area-inset-top) + 12px); left:14px; z-index:10;
    color:#243; pointer-events:none; }
  #hud .score { font-size:40px; font-weight:800; letter-spacing:.01em; line-height:1;
    color:var(--coral-dk); text-shadow:0 1px 0 rgba(255,255,255,.6); }
  #hud .score small { font-size:15px; font-weight:700; opacity:.75; }
  #hud .carry { margin-top:6px; font-size:14px; font-weight:700; color:#c8863c;
    text-shadow:0 1px 0 rgba(255,255,255,.6); }
  #hud .modeStat { margin-top:4px; font-size:15px; font-weight:800; color:var(--coral-dk);
    text-shadow:0 1px 0 rgba(255,255,255,.6); }

  #hint { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:5;
    color:var(--cream); opacity:.9; font-size:12.5px; font-weight:600; text-align:center; line-height:1.7;
    background:var(--chip-bg); padding:9px 15px; border-radius:16px; backdrop-filter:blur(3px);
    transition:opacity .6s ease; pointer-events:none; max-width:92vw; }

  #topbar { position:fixed; top:calc(env(safe-area-inset-top) + 12px); right:12px; z-index:20;
    display:flex; align-items:center; gap:10px; }
  #gear,#reset,#bgm { border:none; cursor:pointer; color:var(--cream); backdrop-filter:blur(4px); flex:none; }
  #gear,#bgm { width:42px; height:42px; border-radius:50%; font-size:20px; background:var(--chip-bg); }
  #reset { height:42px; padding:0 14px; border-radius:999px; font-size:13px; font-weight:700;
    background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#fff;
    box-shadow:0 3px 10px rgba(225,79,112,.45); }
  #panel { position:fixed; top:calc(env(safe-area-inset-top) + 62px); right:12px; z-index:20;
    width:min(280px, calc(100vw - 24px)); padding:14px 16px 16px;
    background:var(--panel-bg); border:1px solid rgba(255,210,180,.16);
    border-radius:16px; color:var(--cream); backdrop-filter:blur(8px);
    display:none; box-shadow:0 12px 40px rgba(0,0,0,.4); }
  #panel.open { display:block; }
  #panel h3 { font-size:13px; font-weight:800; letter-spacing:.04em; opacity:.65; color:var(--gold);
    margin-bottom:12px; text-transform:uppercase; }
  .row { margin-bottom:13px; }
  .row label { display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:5px; }
  .row label span { opacity:.6; font-variant-numeric:tabular-nums; }
  .row input[type=range]{ width:100%; -webkit-appearance:none; height:4px; border-radius:4px; background:rgba(255,255,255,.18); outline:none; }
  .row input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--gold); box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .row input[type=range]::-moz-range-thumb{ width:20px; height:20px; border:none; border-radius:50%; background:var(--gold); }
  .note { font-size:11.5px; opacity:.55; line-height:1.5; margin-top:2px; }

  #title, #result { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:24px; background:rgba(20,17,22,.38); backdrop-filter:blur(2px); }
  #title.hidden, #result.hidden { display:none; }
  #title .card, #result .card { width:min(340px, 100%); background:var(--panel-bg); border:1px solid rgba(255,210,180,.16);
    border-radius:22px; padding:26px 24px 24px; color:var(--cream); box-shadow:0 20px 60px rgba(0,0,0,.45);
    text-align:center; }
  #title h1, #result h1 { font-size:22px; font-weight:800; color:var(--gold); letter-spacing:.02em; margin-bottom:4px; }
  #title .sub { font-size:12px; opacity:.65; margin-bottom:18px; }
  #title .howto { text-align:left; font-size:13.5px; line-height:1.85; background:rgba(0,0,0,.18);
    border-radius:14px; padding:14px 16px; margin-bottom:16px; }
  #title .howto .head { font-weight:800; color:var(--gold); font-size:12px; letter-spacing:.04em;
    text-transform:uppercase; margin-bottom:6px; }
  #title .howto .tease { margin-top:10px; padding-top:10px; border-top:1px dashed rgba(255,255,255,.18);
    font-size:13px; color:#ffd9a0; }
  #title .modes { display:flex; flex-direction:column; gap:10px; }
  #title .modeBtn { width:100%; padding:12px 16px; border:none; border-radius:16px; cursor:pointer;
    text-align:left; color:#fff; background:linear-gradient(135deg, var(--coral), var(--coral-dk));
    box-shadow:0 6px 16px rgba(225,79,112,.4); }
  #title .modeBtn .modeName { display:block; font-size:15px; font-weight:800; }
  #title .modeBtn .modeDesc { display:block; font-size:11.5px; opacity:.85; margin-top:2px; }
  #title .modeBtn.alt { background:linear-gradient(135deg,#7ecbe0,#4a9fc0); box-shadow:0 6px 16px rgba(74,159,192,.4); }
  #title .modeBtn.alt2 { background:linear-gradient(135deg,var(--gold),#e0a53f); box-shadow:0 6px 16px rgba(224,165,63,.4); }
  #result .stats { display:flex; justify-content:space-around; margin:18px 0 14px; }
  #result .stat span { display:block; font-size:26px; font-weight:800; color:var(--gold); }
  #result .stat small { display:block; font-size:11px; opacity:.65; margin-top:2px; }
  #result .best { font-size:13px; font-weight:700; color:#ffd9a0; margin-bottom:16px; min-height:18px; }
  #result button { width:100%; height:48px; border:none; border-radius:999px; font-size:15px; font-weight:800;
    letter-spacing:.02em; cursor:pointer; margin-bottom:10px; }
  #result #r_retry { color:#fff; background:linear-gradient(135deg, var(--coral), var(--coral-dk));
    box-shadow:0 8px 22px rgba(225,79,112,.5); }
  #result #r_toTitle { color:var(--cream); background:rgba(255,255,255,.12); margin-bottom:0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="title">
  <div class="card">
    <h1>LOVOT バルーン</h1>
    <div class="sub">ちびラボットを集めて巣に届けよう</div>
    <div class="howto">
      <div class="head">あそびかた</div>
      ・左右をタップしてパタパタ羽ばたこう<br>
      ・ちびラボットを上から踏んで仲間にしよう<br>
      ・巣まで連れて帰って納品！<br>
      ・横からぶつかると仲間が散らばっちゃうので注意
      <div class="tease">💡 一度にたくさんのちびラボットを集めて巣に返すとボーナス…!?</div>
    </div>
    <div class="modes">
      <button class="modeBtn" data-mode="practice">
        <span class="modeName">練習</span><span class="modeDesc">時間無制限で自由にあそぶ</span>
      </button>
      <button class="modeBtn alt" data-mode="stage">
        <span class="modeName">ステージクリア</span><span class="modeDesc">ちびラボットを20体納品でクリア</span>
      </button>
      <button class="modeBtn alt2" data-mode="time">
        <span class="modeName">1分間チャレンジ</span><span class="modeDesc">60秒でどれだけスコアを稼げるか</span>
      </button>
    </div>
  </div>
</div>

<div id="result" class="hidden">
  <div class="card">
    <h1 id="r_title">クリア！</h1>
    <div class="stats">
      <div class="stat"><span id="r_score">0</span><small>スコア</small></div>
      <div class="stat"><span id="r_count">0</span><small>納品数</small></div>
      <div class="stat"><span id="r_time">0:00</span><small>タイム</small></div>
    </div>
    <div class="best" id="r_best"></div>
    <button id="r_retry">もう一度</button>
    <button id="r_toTitle">タイトルへ戻る</button>
  </div>
</div>

<div id="hud">
  <div class="score"><span id="score">0</span> <small>スコア</small></div>
  <div class="carry" id="carry">抱えてる: 0</div>
  <div class="modeStat" id="modeStat"></div>
</div>
<div id="hint">左タップ＝左の手 / 右タップ＝右の手 / 両方で上昇<br>上から踏んで仲間に → 巣に連れ帰って納品 / 横からぶつかると散らばる</div>

<div id="topbar">
  <button id="bgm">🔊</button>
  <button id="reset">リセット</button>
  <button id="gear">⚙</button>
</div>
<div id="panel">
  <h3>手触り調整</h3>
  <div class="row"><label>ふわふわ感<span id="v_float"></span></label><input type="range" id="s_float" min="0.3" max="3.2" step="0.05"></div>
  <div class="row"><label>重力<span id="v_grav"></span></label><input type="range" id="s_grav" min="300" max="1600" step="20"></div>
  <div class="row"><label>パタパタの力<span id="v_flap"></span></label><input type="range" id="s_flap" min="140" max="520" step="10"></div>
  <div class="row"><label>最高上昇スピード<span id="v_climb"></span></label><input type="range" id="s_climb" min="150" max="700" step="10"></div>
  <div class="row"><label>横の効き<span id="v_side"></span></label><input type="range" id="s_side" min="40" max="360" step="10"></div>
  <div class="row"><label>当たり判定の大きさ<span id="v_hit"></span></label><input type="range" id="s_hit" min="0.4" max="1.1" step="0.02">
    <div class="note">自機の当たり円の半径。見た目の体より小さめが親切。</div></div>
  <div class="row"><label style="cursor:pointer"><input type="checkbox" id="dbg" style="width:auto;height:auto;margin-right:8px;vertical-align:middle"> 当たり判定を表示</label></div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  nest.x=W*0.5; nest.y=H-58; }
addEventListener('resize',resize);

const P={ float:1.4, grav:760, flap:230, side:150, interval:160, maxUp:330, hit:0.85 };

const L={ x:0,y:0, vx:0,vy:0, tilt:0, bob:0, armL:-0.5, armR:0.5, flapPulseL:0, flapPulseR:0, squash:0,
          balloons:2, iframe:0, pupX:0, pupY:0, wing:0 };
const SPR={upTimer:0};
const nest={ x:0,y:0, r:40 };
let score=0, banked=0;
const STAGE_TARGET=20, TIME_LIMIT=60;
let mode='practice', phase='title', elapsed=0, timeLeft=TIME_LIMIT;
const enemies=[], tail=[], loose=[], puffs=[], hist=[], delivering=[], popups=[];
function easeOutBack(x){ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }
const SP=7;               // history frames between followers
const R=30;               // lovot body radius
const palette=['#ff9db0','#9ad0ff','#c3b0ff','#a6e3b0','#ffb0d8']; // no yellow/gold — that's reserved for the rare golden mini
// enemy kinds: which sides carry spikes (drawn) and which approach directions are safe to befriend from
const ENEMY_KINDS={
  normal: { spikes:['bottom'],              safe:['top','left','right'] },
  spike:  { spikes:['bottom','left','right'], safe:['top'] },
};
const sprDN=new Image(); sprDN.src='assets/images/lovot-wing-down.png';
const sprUP=new Image(); sprUP.src='assets/images/lovot-wing-up.png';
const SPRW=231, SPRH=300, EYESI=[[86.4,110.9],[144.6,111.0]], EYERI=10.8;
const SPRSCALE=(R*3.05)/SPRH, SDW=SPRW*SPRSCALE, SDH=SPRH*SPRSCALE;
const _emx=(EYESI[0][0]+EYESI[1][0])/2, _emy=(EYESI[0][1]+EYESI[1][1])/2;
const SOFFX=SDW/2-_emx*SPRSCALE, SOFFY=(-R*0.12)+SDH/2-_emy*SPRSCALE;
const EYESL=[[-SDW/2+SOFFX+EYESI[0][0]*SPRSCALE,-SDH/2+SOFFY+EYESI[0][1]*SPRSCALE],
            [-SDW/2+SOFFX+EYESI[1][0]*SPRSCALE,-SDH/2+SOFFY+EYESI[1][1]*SPRSCALE]];
const EYER=EYERI*SPRSCALE;
const SPRTOPY=-SDH/2+SOFFY;   // how far the sprite's top (head/antenna) sits above the anchor (L.x,L.y)
// SOFFY centers the hit-circle on the sprite's bounding-box middle, but LOVOT's silhouette is
// bottom-heavy (small head, round belly) so that geometric center still reads as "too high" against
// the art. Bias it further down toward the belly to match what's actually drawn.
const HITCY=SOFFY+R*0.4;

// ---------- sfx ----------
// No recorded sound files yet: each cue is synthesized with Web Audio. Drop a matching file into
// assets/sounds/ (see filenames below) and it is picked up automatically in place of the synth tone.
const SFX=(()=>{
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  function ensure(){ if(ac.state==='suspended') ac.resume(); return ac; }
  // voice-tracked sounds (recollect during the delivery fly-in fires every 0.1s) cut the
  // previous instance short instead of stacking, so rapid retriggers stay a crisp blip.
  // this applies to both synth oscillators and decoded file buffers below — both expose the
  // same {osc,gain} shape (AudioBufferSourceNode has .stop() just like OscillatorNode).
  const active={};
  function cutVoice(voice,a){ const prev=active[voice]; if(!prev) return;
    try{ prev.gain.cancelScheduledValues(a.currentTime); prev.gain.setValueAtTime(prev.gain.value,a.currentTime);
      prev.gain.linearRampToValueAtTime(0,a.currentTime+0.008); prev.osc.stop(a.currentTime+0.01); }catch(e){}
    delete active[voice]; }
  function tone(voice,freq,dur,type,gain,slideTo,delay){
    const a=ensure(); if(voice) cutVoice(voice,a);
    const t0=a.currentTime+(delay||0);
    const osc=a.createOscillator(), g=a.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t0+dur);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(gain,t0+0.01); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    osc.connect(g); g.connect(a.destination); osc.start(t0); osc.stop(t0+dur+0.02);
    if(voice){ active[voice]={osc,gain:g.gain}; osc.onended=()=>{ if(active[voice]&&active[voice].osc===osc) delete active[voice]; }; }
  }
  const synth={
    flap:     ()=>tone('flap',520,0.09,'sine',0.10,340),
    befriend: ()=>tone('befriend',660,0.16,'triangle',0.16,990),
    recollect:()=>tone('recollect',520,0.12,'triangle',0.13,760),
    hit:      ()=>tone('hit',220,0.22,'sawtooth',0.15,90),
    pop:      ()=>tone('pop',180,0.28,'sawtooth',0.18,40),
    deliver:  ()=>{ tone(null,520,0.12,'sine',0.15); tone(null,660,0.14,'sine',0.15,null,0.07); tone(null,880,0.18,'sine',0.15,null,0.14); },
    miss:     ()=>{ tone(null,300,0.22,'triangle',0.18,140); tone(null,180,0.35,'triangle',0.18,90,0.18); },
    sparkle:  ()=>{ tone(null,1046,0.1,'sine',0.12); tone(null,1318,0.1,'sine',0.12,null,0.07);
      tone(null,1568,0.14,'sine',0.13,null,0.14); tone(null,2093,0.18,'sine',0.12,null,0.21); },
    shine:    ()=>{ tone(null,1568,0.12,'sine',0.14); tone(null,2093,0.16,'sine',0.13,null,0.09); },
  };
  // voice-tracked file cues (retriggered rapidly, same as their synth counterparts above) vs.
  // one-shot layered cues (deliver/miss/sparkle/shine) that are fine to overlap.
  const VOICED=new Set(['flap','befriend','recollect','hit','pop']);
  const files={ flap:'assets/sounds/flap.mp3', befriend:'assets/sounds/befriend.wav',
    recollect:'assets/sounds/recollect.mp3', hit:'assets/sounds/hit.wav', deliver:'assets/sounds/deliver.wav',
    pop:'assets/sounds/風船割れる.mp3', miss:'assets/sounds/one_miss.wav', sparkle:'assets/sounds/きらきら輝く3.mp3',
    shine:'assets/sounds/可愛く輝く1.mp3' };
  // decode every file up front into an AudioBuffer: playback is then a plain AudioBufferSourceNode
  // (sample-accurate, no per-play seek/decode latency) instead of re-seeking a shared <audio>
  // element, which could fall behind under rapid retriggers (e.g. recollect firing every 0.1s
  // while a big flock banks in) and made cues feel increasingly delayed over a long session.
  const buf={};
  for(const name in files){
    fetch(files[name]).then(r=>r.ok?r.arrayBuffer():Promise.reject())
      .then(ab=>ac.decodeAudioData(ab)).then(decoded=>{ buf[name]=decoded; }).catch(()=>{});
  }
  function playBuffer(name){
    const a=ensure(), voice=VOICED.has(name)?name:null;
    if(voice) cutVoice(voice,a);
    const src=a.createBufferSource(), g=a.createGain();
    src.buffer=buf[name];
    g.gain.setValueAtTime(0,a.currentTime); g.gain.linearRampToValueAtTime(0.6,a.currentTime+0.005);
    src.connect(g); g.connect(a.destination); src.start();
    if(voice){ active[voice]={osc:src,gain:g.gain}; src.onended=()=>{ if(active[voice]&&active[voice].osc===src) delete active[voice]; }; }
  }
  function play(name){ if(buf[name]) playBuffer(name); else synth[name](); }
  const api={}; for(const name in synth) api[name]=()=>play(name);
  return api;
})();

// ---------- bgm ----------
// Plays the whole bgm/ library as a shuffled playlist: order is reshuffled each time it's
// exhausted, and each track auto-advances to the next when it ends (no per-track looping).
const BGM=(()=>{
  const TRACKS=[
    'assets/sounds/bgm/ふわふわの空.mp3', 'assets/sounds/bgm/ふわふわの空_2.mp3', 'assets/sounds/bgm/ふわふわの空_3.mp3',
    'assets/sounds/bgm/Pixel Parade.mp3', 'assets/sounds/bgm/Pixel Parade_2.mp3', 'assets/sounds/bgm/Pixel Parade_3.mp3',
  ];
  function shuffle(arr){ const a=arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
    return a; }
  let order=shuffle(TRACKS), idx=0;
  let muted=localStorage.getItem('lovot_bgm_muted')==='1', started=false;
  const el=new Audio(); el.volume=0.35; el.src=order[idx];
  el.addEventListener('ended',()=>{
    idx++; if(idx>=order.length){ order=shuffle(TRACKS); idx=0; }
    el.src=order[idx]; if(!muted) el.play().catch(()=>{});
  });
  const btn=document.getElementById('bgm');
  function refreshBtn(){ btn.textContent=muted?'🔇':'🔊'; }
  function start(){ if(started) return; started=true; if(!muted) el.play().catch(()=>{}); }
  btn.addEventListener('click',()=>{
    muted=!muted; localStorage.setItem('lovot_bgm_muted',muted?'1':'0');
    if(muted) el.pause(); else if(started) el.play().catch(()=>{});
    refreshBtn();
  });
  refreshBtn();
  return { start };
})();

function resetAll(){ L.x=W*0.5; L.y=H*0.42; L.vx=0; L.vy=0; L.balloons=2; L.iframe=0;
  tail.length=0; loose.length=0; enemies.length=0; hist.length=0; score=0; banked=0;
  delivering.length=0; popups.length=0; elapsed=0; timeLeft=TIME_LIMIT;
  for(let i=0;i<5;i++) spawnEnemy(); }
function respawnLovot(){ L.x=nest.x; L.y=nest.y-120; L.vx=0; L.vy=0; L.balloons=2; L.iframe=1.6; hist.length=0; }

function spawnEnemy(){
  const side=Math.random()<0.5?-1:1;
  const golden=Math.random()<0.08;   // rare golden mini: sparkly, worth 10x when delivered
  const kind=Math.random()<0.25?'spike':'normal';
  enemies.push({ x: side<0? 40: W-40, y: 90+Math.random()*(H*0.55),
    vx: side*(24+Math.random()*26), vy:0, bob:Math.random()*7, r:17,
    color: golden?'#ffd700':palette[(Math.random()*palette.length)|0], golden, kind, t:Math.random()*10 });
  if(golden) SFX.shine();
}

// ---------- input ----------
const pointers=new Map(); let keyL=false,keyR=false, holdL=false,holdR=false, tL=0,tR=0, hinted=false;
function sideOf(x){ return x<innerWidth/2?'L':'R'; }
function recompute(){ const s=new Set(pointers.values()); holdL=s.has('L')||keyL; holdR=s.has('R')||keyR; }
function fadeHint(){ if(!hinted){ hinted=true; document.getElementById('hint').style.opacity=0; } }
function flap(side){ const f=P.flap*(L.balloons>=2?1:0.82); L.wing=0.13; SPR.upTimer=0.12; SFX.flap();
  if(side==='L'){ L.vy-=f; L.vx-=P.side; L.flapPulseL=1; } else { L.vy-=f; L.vx+=P.side; L.flapPulseR=1; } }
let started=false;
function press(side){ if(!started||phase!=='playing')return; BGM.start(); flap(side); if(side==='L')tL=0; else tR=0; }
const stage=document.getElementById('stage');
addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('pointerdown',e=>{ const wl=[...pointers.values()].includes('L'), wr=[...pointers.values()].includes('R');
  const s=sideOf(e.clientX); pointers.set(e.pointerId,s); recompute(); fadeHint();
  if(s==='L'&&!wl)press('L'); if(s==='R'&&!wr)press('R'); });
function up(e){ if(pointers.has(e.pointerId)){ pointers.delete(e.pointerId); recompute(); } }
stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key==='a'){ if(!keyL){keyL=true;recompute();press('L');fadeHint();} }
  if(e.key==='ArrowRight'||e.key==='d'){ if(!keyR){keyR=true;recompute();press('R');fadeHint();} }
  if(e.key===' '){ if(!keyL)press('L'); if(!keyR)press('R'); keyL=keyR=true; recompute(); fadeHint(); e.preventDefault(); } });
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'){ keyL=false; recompute(); }
  if(e.key==='ArrowRight'||e.key==='d'){ keyR=false; recompute(); }
  if(e.key===' '){ keyL=keyR=false; recompute(); } });

// ---------- clouds ----------
const clouds=[]; for(let i=0;i<6;i++) clouds.push({x:Math.random()*W,y:Math.random()*innerHeight*0.6,s:.5+Math.random()*.9,sp:5+Math.random()*8});

function addPuff(x,y,c){ puffs.push({x,y,r:6,c,a:1}); }
function befriend(e){ tail.push({color:e.color,golden:e.golden}); L.vy=-280; L.squash=0.5; addPuff(e.x,e.y,e.color); SFX.befriend();
  const i=enemies.indexOf(e); if(i>=0) enemies.splice(i,1); spawnEnemy(); }
function scatterTail(){ // sonic-style: whole tail drops & scatters, recoverable
  for(let i=0;i<tail.length;i++){ const p=tailPos(i);
    loose.push({ x:p.x, y:p.y, vx:(Math.random()-0.5)*260, vy:-120-Math.random()*140,
      color:tail[i].color, golden:tail[i].golden, arm:0.45, life:6.5 }); }
  tail.length=0; L.iframe=1.0; L.vy=-140; SFX.hit(); }
const MISS_LINES=['うわーん！','わわっ！','きゃー！','あちゃー…','とほほ…','ぷしゅ〜'];
function loseBalloon(){ L.balloons--; L.iframe=1.2; L.vy=-160; L.vx*=-0.4; SFX.pop();
  if(L.balloons<=0){ addPuff(L.x,L.y,'#fff'); SFX.miss();
    const line=MISS_LINES[(Math.random()*MISS_LINES.length)|0];
    popups.push({x:L.x,y:L.y-50,text:line,color:'#9ad0ff',size:32,life:1.2,life0:1.2,vy:-38,bounce:true});
    respawnLovot(); } }
function tailPos(i){ const idx=Math.min((i+1)*SP, hist.length-1); return hist[idx]||{x:L.x,y:L.y}; }

// ---------- loop ----------
let last=performance.now();
function tick(now){ let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(phase!=='playing'){ draw(); requestAnimationFrame(tick); return; }

  if(holdL){ tL+=dt*1000; if(tL>=P.interval){ flap('L'); tL-=P.interval; } }
  if(holdR){ tR+=dt*1000; if(tR>=P.interval){ flap('R'); tR-=P.interval; } }

  // lovot physics
  L.vy+=P.grav*dt;
  L.vx-=L.vx*(P.float*1.05)*dt; L.vy-=L.vy*(P.float*0.72)*dt;
  if(L.vy<-P.maxUp) L.vy=-P.maxUp;
  L.x+=L.vx*dt; L.y+=L.vy*dt;
  const m=40;
  if(L.x<m){L.x=m;L.vx*=-0.32;} if(L.x>W-m){L.x=W-m;L.vx*=-0.32;}
  const ceil=-SPRTOPY+6; if(L.y<ceil){L.y=ceil; if(L.vy<0)L.vy*=-0.25;}
  const gnd=H-58; if(L.y>gnd){L.y=gnd; if(L.vy>0){L.squash=Math.min(1,L.vy/900);L.vy*=-0.14;}}
  if(L.iframe>0) L.iframe-=dt;

  // history for tail
  hist.unshift({x:L.x,y:L.y}); if(hist.length> (tail.length+2)*SP+30) hist.length=(tail.length+2)*SP+30;

  // enemies
  for(const e of enemies){ e.t+=dt; e.x+=e.vx*dt; e.y+=Math.sin(e.t*1.3+e.bob)*10*dt*3;
    if(e.x<30){e.x=30;e.vx*=-1;} if(e.x>W-30){e.x=W-30;e.vx*=-1;}
    if(e.y<80)e.y=80; if(e.y>H-100)e.y=H-100; }

  // collisions lovot vs enemies (hit-circle centered on the sprite's visual body, not the eye anchor).
  // each enemy kind has spiky sides and a set of safe approach directions (see ENEMY_KINDS) —
  // touching a spiky side scatters/damages, touching a safe side befriends it.
  const hcy=L.y+HITCY, hitR=R*P.hit;
  if(L.iframe<=0){
    for(const e of enemies){ const dx=L.x-e.x, dy0=hcy-e.y; const d=Math.hypot(dx,dy0);
      if(d < hitR+e.r){
        const dy=dy0-e.r*0.3; // bias so a near-top approach still reads as "top" (keeps stomps forgiving)
        const dir=Math.abs(dy)>Math.abs(dx) ? (dy<0?'top':'bottom') : (dx<0?'left':'right');
        const safe=ENEMY_KINDS[e.kind||'normal'].safe;
        if(safe.includes(dir)){ befriend(e); break; }
        else { if(tail.length>0) scatterTail(); else loseBalloon(); break; }
      } }
  }

  // loose (scattered) update + recollect
  for(let i=loose.length-1;i>=0;i--){ const o=loose[i];
    o.arm=Math.max(0,o.arm-dt); o.life-=dt;
    o.vy+=P.grav*0.7*dt; o.vy-=o.vy*0.8*dt; o.vx-=o.vx*1.4*dt;
    o.x+=o.vx*dt; o.y+=o.vy*dt;
    const lg=H-52; if(o.y>lg){o.y=lg; o.vy*=-0.35; o.vx*=0.6;}
    if(o.x<20)o.x=20; if(o.x>W-20)o.x=W-20;
    if(o.arm<=0 && Math.hypot(L.x-o.x,hcy-o.y) < hitR+16){ tail.push({color:o.color,golden:o.golden}); loose.splice(i,1); addPuff(o.x,o.y,o.color); SFX.recollect(); continue; }
    if(o.life<=0){ loose.splice(i,1); }
  }

  // bank at nest: the flock peels off one by one and flies into the nest, each landing
  // adding its place in line (1,2,3…) so the running total lands on the triangular bonus
  // by the time the last one arrives — golden minis are worth 10x their place in line
  if(tail.length>0 && Math.hypot(L.x-nest.x, L.y-nest.y) < nest.r+R*0.6){
    const n=tail.length, batch={remaining:n, total:0, hasGolden:false, count:n};
    for(let i=0;i<n;i++){ const p=tailPos(i), golden=!!tail[i].golden, pts=(i+1)*(golden?10:1);
      batch.total+=pts; if(golden) batch.hasGolden=true;
      delivering.push({x:p.x,y:p.y,sx:p.x,sy:p.y,color:tail[i].color,golden,pts,delay:i*0.1,t:0,prog:0,batch}); }
    tail.length=0; SFX.deliver();
  }

  // delivering minis: fly one by one from wherever they were in line into the nest
  for(let i=delivering.length-1;i>=0;i--){ const d=delivering[i];
    if(d.delay>0){ d.delay-=dt; continue; }
    d.t+=dt; const prog=Math.min(1,d.t/0.45), ease=1-(1-prog)*(1-prog); d.prog=prog;
    d.x=d.sx+(nest.x-d.sx)*ease; d.y=d.sy+(nest.y-10-d.sy)*ease-Math.sin(prog*Math.PI)*36;
    if(prog>=1){
      score+=d.pts; banked++; addPuff(nest.x,nest.y-10,d.color); SFX.recollect();
      popups.push({x:nest.x+(Math.random()-0.5)*24,y:nest.y-34,text:(d.golden?'✨+':'+')+d.pts,
        color:d.golden?'#ffd700':'#fff3da',size:d.golden?30:22,life:0.6,life0:0.6,vy:-46});
      if(d.golden) for(let k=0;k<6;k++) addPuff(nest.x+(Math.random()-0.5)*30, nest.y-14+(Math.random()-0.5)*16, '#ffe9a8');
      d.batch.remaining--;
      if(d.batch.remaining<=0){
        popups.push({x:nest.x,y:nest.y-50,text:d.batch.count+'体 とどけた！',text2:'ボーナス +'+d.batch.total,
          color:'#ffd27a',color2:'#fff3da',size:32,size2:19,life:2.4,life0:2.4,vy:-28,bounce:true});
        for(let k=0;k<12;k++) addPuff(nest.x+(Math.random()-0.5)*46, nest.y-10+(Math.random()-0.5)*22, palette[(Math.random()*palette.length)|0]);
        SFX.deliver();
        if(d.batch.hasGolden) setTimeout(()=>SFX.sparkle(), 350);
      }
      delivering.splice(i,1);
    }
  }

  // mode progress / end conditions
  elapsed+=dt;
  if(mode==='time'){ timeLeft=Math.max(0,TIME_LIMIT-elapsed); if(timeLeft<=0) finishGame(); }
  else if(mode==='stage' && banked>=STAGE_TARGET) finishGame();

  // floating score popups
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.life-=dt; p.y+=p.vy*dt; p.vy*=Math.max(0,1-dt*1.5);
    if(p.life<=0) popups.splice(i,1); }

  // puffs
  for(let i=puffs.length-1;i>=0;i--){ const p=puffs[i]; p.r+=dt*70; p.a-=dt*2.2; if(p.a<=0)puffs.splice(i,1); }

  // cosmetics
  L.tilt += ((-L.vx/900)-L.tilt)*Math.min(1,dt*10); L.bob+=dt*3;
  { const spd=Math.hypot(L.vx,L.vy); const tx=spd>25?L.vx/spd:0, ty=spd>25?L.vy/spd:0;
    L.pupX+=(tx-L.pupX)*Math.min(1,dt*12); L.pupY+=(ty-L.pupY)*Math.min(1,dt*12); }
  L.flapPulseL=Math.max(0,L.flapPulseL-dt*6); L.flapPulseR=Math.max(0,L.flapPulseR-dt*6);
  L.armL += ((-0.5-L.flapPulseL*1.6)-L.armL)*Math.min(1,dt*22);
  L.armR += (( 0.5+L.flapPulseR*1.6)-L.armR)*Math.min(1,dt*22);
  L.squash=Math.max(0,L.squash-dt*3); L.wing=Math.max(0,L.wing-dt);
  SPR.upTimer=Math.max(0,SPR.upTimer-dt);
  for(const cl of clouds){ cl.x-=cl.sp*dt*3; if(cl.x<-120){cl.x=W+80;cl.y=Math.random()*innerHeight*0.6;} }

  document.getElementById('score').textContent=score;
  document.getElementById('carry').textContent='抱えてる: '+tail.length;
  updateModeStat();

  draw();
  requestAnimationFrame(tick);
}
function updateModeStat(){
  const el=document.getElementById('modeStat');
  if(mode==='stage') el.textContent='納品 '+Math.min(banked,STAGE_TARGET)+' / '+STAGE_TARGET+'体';
  else if(mode==='time'){ const s=Math.ceil(timeLeft); el.textContent='残り '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  else el.textContent='';
}

// ---------- draw ----------
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#a9d4ee'); g.addColorStop(.55,'#cfe6f2'); g.addColorStop(1,'#f6e9d8');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const sg=ctx.createRadialGradient(W*0.8,H*0.15,10,W*0.8,H*0.15,170); sg.addColorStop(0,'rgba(255,246,214,.9)'); sg.addColorStop(1,'rgba(255,246,214,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W*0.8,H*0.15,170,0,7); ctx.fill();
  for(const cl of clouds){ ctx.fillStyle='rgba(255,255,255,.72)'; puff(cl.x,cl.y,32*cl.s); }

  // hills
  ctx.fillStyle='#bfe3a6'; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H-50);
  ctx.quadraticCurveTo(W*0.25,H-84,W*0.5,H-52); ctx.quadraticCurveTo(W*0.78,H-20,W,H-58); ctx.lineTo(W,H); ctx.fill();
  ctx.fillStyle='#a9d792'; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H-26);
  ctx.quadraticCurveTo(W*0.4,H-52,W*0.7,H-30); ctx.quadraticCurveTo(W*0.9,H-14,W,H-34); ctx.lineTo(W,H); ctx.fill();

  drawNest();
  for(const o of loose){ const blink = o.life<1.5 && (Math.floor(o.life*8)%2===0); if(!blink) miniLovot(o.x,o.y,0.78,o.color,'sad',o.golden); }
  for(const e of enemies) miniLovot(e.x,e.y,0.82,e.color,'idle',e.golden,ENEMY_KINDS[e.kind||'normal'].spikes);
  // tail followers (far first)
  for(let i=tail.length-1;i>=0;i--){ const p=tailPos(i); miniLovot(p.x,p.y,0.7,tail[i].color,'happy',tail[i].golden); }
  for(const d of delivering) miniLovot(d.x,d.y,0.7-d.prog*0.3,d.color,'happy',d.golden);
  drawLovot();
  for(const p of puffs){ ctx.fillStyle=`rgba(255,255,255,${Math.max(0,p.a)*0.7})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
    ctx.strokeStyle=hexA(p.c,Math.max(0,p.a)); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke(); }
  for(const p of popups){ const inProg=Math.min(1,(p.life0-p.life)/0.12);
    const scale=p.bounce ? 0.4+0.9*easeOutBack(inProg) : 0.6+0.5*inProg;
    ctx.save(); ctx.globalAlpha=Math.min(1,p.life/p.life0*3); ctx.translate(p.x,p.y); ctx.scale(scale,scale);
    ctx.font=`900 ${p.size}px ui-rounded, "Hiragino Maru Gothic ProN", sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(40,20,10,.55)'; ctx.strokeText(p.text,0,0);
    ctx.fillStyle=p.color; ctx.fillText(p.text,0,0);
    if(p.text2){ const dy=p.size*0.66; ctx.font=`800 ${p.size2||Math.round(p.size*0.55)}px ui-rounded, "Hiragino Maru Gothic ProN", sans-serif`;
      ctx.lineWidth=3; ctx.strokeText(p.text2,0,dy);
      ctx.fillStyle=p.color2||p.color; ctx.fillText(p.text2,0,dy); }
    ctx.restore(); }
  if(DEBUG){ ctx.lineWidth=2;
    ctx.strokeStyle='rgba(0,200,255,.95)'; ctx.beginPath(); ctx.arc(L.x,L.y+HITCY,R*P.hit,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(255,60,80,.9)'; for(const e of enemies){ ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.stroke(); }
    ctx.strokeStyle='rgba(255,180,0,.85)'; for(const o of loose){ ctx.beginPath(); ctx.arc(o.x,o.y,16,0,7); ctx.stroke(); }
    ctx.strokeStyle='rgba(120,220,120,.8)'; ctx.beginPath(); ctx.arc(nest.x,nest.y,nest.r,0,7); ctx.stroke(); }
}
function hexA(h,a){ return `rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${a})`; }
function puff(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.arc(x+r*.9,y+r*.15,r*.8,0,7); ctx.arc(x-r*.9,y+r*.2,r*.72,0,7); ctx.arc(x+r*.2,y-r*.35,r*.7,0,7); ctx.fill(); }

function drawNest(){
  // banked pile peeking out (absolute coords)
  const show=Math.min(banked,7);
  for(let i=0;i<show;i++){ const a=(i/7)*Math.PI - Math.PI*0.05; const rx=Math.cos(a)*26, ry=-6-Math.sin(a)*10;
    miniLovot(nest.x+rx, nest.y+ry-6, 0.5, palette[i%palette.length],'happy'); }
  ctx.save(); ctx.translate(nest.x,nest.y);
  // basket
  ctx.fillStyle='#c99b63'; ctx.beginPath(); ctx.ellipse(0,6,44,20,0,0,7); ctx.fill();
  ctx.fillStyle='#b3874f'; ctx.beginPath(); ctx.ellipse(0,2,44,15,0,Math.PI,0); ctx.fill();
  ctx.strokeStyle='#a2793f'; ctx.lineWidth=2.4;
  for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(i*12,-6); ctx.lineTo(i*12,14); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(0,-2,44,13,0,0,Math.PI,true); ctx.stroke();
  ctx.fillStyle='rgba(60,90,60,.55)'; ctx.font='bold 11px ui-rounded,sans-serif'; ctx.textAlign='center'; ctx.fillText('巣',0,-26);
  ctx.restore();
}

function hoodedLovot(cover, mood, horn, hornGlow, lookX, lookY){
  lookX=lookX||0; lookY=lookY||0;
  const dark=shade(cover);
  // hooded cover (teardrop)
  ctx.fillStyle=cover;
  ctx.beginPath();
  ctx.moveTo(0,-R*1.18);
  ctx.bezierCurveTo(R*0.98,-R*1.08, R*1.12,-R*0.12, R*0.84,R*0.52);
  ctx.bezierCurveTo(R*0.58,R*0.92, -R*0.58,R*0.92, -R*0.84,R*0.52);
  ctx.bezierCurveTo(-R*1.12,-R*0.12, -R*0.98,-R*1.08, 0,-R*1.18);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle=dark;
  ctx.beginPath(); ctx.ellipse(0,R*0.4,R*0.78,R*0.34,0,0,Math.PI); ctx.fill(); ctx.restore();
  // cream face
  ctx.fillStyle='#f1ebe0';
  ctx.beginPath(); ctx.ellipse(0,-R*0.1,R*0.64,R*0.72,0,0,7); ctx.fill();
  // cheeks
  ctx.fillStyle='rgba(240,175,175,.4)';
  ctx.beginPath(); ctx.ellipse(-R*0.38,R*0.16,R*0.13,R*0.085,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse( R*0.38,R*0.16,R*0.13,R*0.085,0,0,7); ctx.fill();
  // eyes
  const ey=-R*0.12, ex=R*0.30;
  for(const s of [-1,1]){
    if(mood==='happy'){ ctx.strokeStyle='#3b3640'; ctx.lineWidth=Math.max(2,R*0.09); ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(s*ex,ey+R*0.02,R*0.15,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); }
    else {
      // white eyeball
      ctx.fillStyle='#f6f3ee'; ctx.beginPath(); ctx.ellipse(s*ex,ey,R*0.17,R*0.22,0,0,7); ctx.fill();
      // black pupil, offset toward travel direction (stronger when looking down)
      const ox=lookX*R*0.08, oy=lookY>0 ? lookY*R*0.12 : lookY*R*0.085;
      ctx.fillStyle='#2b2730'; ctx.beginPath(); ctx.ellipse(s*ex+ox,ey+oy,R*0.09,R*0.105,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(s*ex+ox-R*0.032,ey+oy-R*0.04,R*0.03,0,7); ctx.fill(); } }
  // nose
  ctx.fillStyle='#caa08a'; ctx.beginPath(); ctx.ellipse(0,ey+R*0.19,R*0.055,R*0.04,0,0,7); ctx.fill();
  // horn (sensor)
  if(horn){ ctx.strokeStyle='#3a3a40'; ctx.lineWidth=Math.max(2.5,R*0.1); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-R*1.12); ctx.lineTo(0,-R*1.12-R*0.4); ctx.stroke();
    ctx.fillStyle='#34343b'; ctx.beginPath(); ctx.ellipse(0,-R*1.12-R*0.48,R*0.16,R*0.14,0,0,7); ctx.fill();
    if(hornGlow!==undefined){ ctx.fillStyle=`rgba(140,220,255,${0.35+hornGlow*0.5})`; ctx.beginPath(); ctx.arc(0,-R*1.12-R*0.48,R*0.055,0,7); ctx.fill(); } }
}
function drawSpikes(sides,color){
  // soft rounded "thorn" petals in the mini's own palette, instead of hard gray triangles —
  // matches the rest of the design's borderless, pastel-gradient look
  const dark=shade(color);
  const arcs={ top:[235,305], bottom:[55,125], left:[145,215], right:[-35,35] };
  for(const side of sides){
    const [a0,a1]=arcs[side], n=1;
    for(let i=0;i<n;i++){
      const t=n===1?0.5:i/(n-1), ang=(a0+(a1-a0)*t)*Math.PI/180;
      const baseR=R*0.92, len=R*0.42, w=6;
      const bx=Math.cos(ang)*baseR, by=Math.sin(ang)*baseR*0.92;
      ctx.save(); ctx.translate(bx,by); ctx.rotate(ang+Math.PI/2);
      const g=ctx.createLinearGradient(0,2,0,-len);
      g.addColorStop(0,color); g.addColorStop(1,dark);
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(-w,2);
      ctx.quadraticCurveTo(-w*0.3,-len*0.6,0,-len);
      ctx.quadraticCurveTo(w*0.3,-len*0.6,w,2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}
function miniLovot(x,y,sc,color,mood,golden,spikeSides){
  ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
  const bob=Math.sin(L.bob+x*0.05)*2; ctx.translate(0,bob);
  if(golden){
    const pulse=0.5+0.5*Math.sin(L.bob*3), breathe=1+0.06*Math.sin(L.bob*4);
    ctx.scale(breathe,breathe);
    // big soft outer glow, pulsing
    const og=ctx.createRadialGradient(0,0,R*0.4,0,0,R*(2.3+pulse*0.4));
    og.addColorStop(0,`rgba(255,235,150,${0.35+pulse*0.2})`); og.addColorStop(1,'rgba(255,235,150,0)');
    ctx.fillStyle=og; ctx.beginPath(); ctx.arc(0,0,R*(2.3+pulse*0.4),0,7); ctx.fill();
    // brighter inner core
    const gg=ctx.createRadialGradient(0,0,4,0,0,R*1.3); gg.addColorStop(0,'rgba(255,250,220,.7)'); gg.addColorStop(1,'rgba(255,225,140,0)');
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,R*1.3,0,7); ctx.fill();
    // rotating halo ring
    ctx.save(); ctx.rotate(L.bob*1.1); ctx.setLineDash([6,7]); ctx.lineDashOffset=0;
    ctx.strokeStyle=`rgba(255,215,90,${0.5+pulse*0.3})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,R*1.2,0,7); ctx.stroke(); ctx.restore();
  }
  // little balloon above
  ctx.strokeStyle='rgba(120,120,130,.5)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(0,-R*1.1); ctx.quadraticCurveTo(R*0.3,-R*1.5,R*0.28,-R*1.75); ctx.stroke();
  const bg=ctx.createRadialGradient(R*0.2,-R*1.85,2,R*0.28,-R*1.75,16); bg.addColorStop(0,'#fff'); bg.addColorStop(.3,color); bg.addColorStop(1,shade(color));
  ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(R*0.28,-R*1.78,13,16,0,0,7); ctx.fill();
  hoodedLovot(color, mood, false, undefined, 0, mood==='sad'?0.8:0);
  if(spikeSides && spikeSides.length) drawSpikes(spikeSides,color);
  if(golden){
    const n=7;
    for(let i=0;i<n;i++){
      const a=L.bob*1.6+i*(Math.PI*2/n), rad=R*(1.1+0.35*((i*37)%5)/5), sx=Math.cos(a)*rad, sy=Math.sin(a)*rad*0.85;
      const tw=0.5+0.5*Math.sin(L.bob*5+i*2), s=4+5*tw;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(a); ctx.globalAlpha=0.55+0.45*tw; ctx.fillStyle=i%2?'#fff7d6':'#ffd76b';
      ctx.beginPath();
      ctx.moveTo(0,-s); ctx.lineTo(s*0.32,-s*0.32); ctx.lineTo(s,0); ctx.lineTo(s*0.32,s*0.32);
      ctx.lineTo(0,s); ctx.lineTo(-s*0.32,s*0.32); ctx.lineTo(-s,0); ctx.lineTo(-s*0.32,-s*0.32);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  ctx.restore();
}
function shade(h){ const r=Math.max(0,parseInt(h.slice(1,3),16)-40),g=Math.max(0,parseInt(h.slice(3,5),16)-40),b=Math.max(0,parseInt(h.slice(5,7),16)-40); return `rgb(${r},${g},${b})`; }

function drawLovot(){
  const blink = L.iframe>0 && (Math.floor(L.iframe*10)%2===0);
  ctx.save(); ctx.translate(L.x, L.y+Math.sin(L.bob)*3); ctx.rotate(L.tilt*0.5);
  ctx.scale(1+L.squash*0.18, 1-L.squash*0.18); if(blink) ctx.globalAlpha=0.45;
  const sway=Math.sin(L.bob*0.9)*6 - L.vx*0.03;
  if(L.balloons>=1) balloon(-16+sway*0.4,-R-64,'#ff9db0','#ff7d97');
  if(L.balloons>=2) balloon(16+sway,-R-76,'#ffd27a','#ffbf4d');
  const img=(L.wing>0? sprUP: sprDN);
  if(img.complete && img.naturalWidth) ctx.drawImage(img, -SDW/2+SOFFX, -SDH/2+SOFFY, SDW, SDH);
  drawPupils();
  ctx.restore();
}
function drawPupils(){
  const er=EYER, mo=er*0.42;
  const ox=L.pupX*mo, oy=(L.pupY>0? L.pupY*er*0.62 : L.pupY*er*0.4);
  for(const e of EYESL){
    ctx.fillStyle='#2b2730'; ctx.beginPath(); ctx.ellipse(e[0]+ox,e[1]+oy,er*0.5,er*0.58,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(e[0]+ox-er*0.18,e[1]+oy-er*0.2,er*0.15,0,7); ctx.fill();
  }
}
function arm(dir){ ctx.fillStyle='#eee7db'; ctx.beginPath(); ctx.ellipse(dir*8,10,6.5,12,dir*0.5,0,7); ctx.fill(); }
function balloon(bx,by,c1,c2){ ctx.strokeStyle='rgba(120,120,130,.5)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(bx,by+21); ctx.quadraticCurveTo(bx*0.4,by+38,0,-14); ctx.stroke();
  const bg=ctx.createRadialGradient(bx-6,by-8,3,bx,by,25); bg.addColorStop(0,c1); bg.addColorStop(1,c2); ctx.fillStyle=bg;
  ctx.beginPath(); ctx.ellipse(bx,by,20,24,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(bx-7,by-9,4,6.5,-0.4,0,7); ctx.fill(); }

// ---------- panel ----------
const gear=document.getElementById('gear'), panel=document.getElementById('panel');
gear.addEventListener('click',()=>panel.classList.toggle('open'));
document.getElementById('reset').addEventListener('click',resetAll);
function bind(id,key,fmt){ const s=document.getElementById('s_'+id),v=document.getElementById('v_'+id);
  s.value=P[key]; const show=()=>v.textContent=fmt(P[key]); show(); s.addEventListener('input',()=>{P[key]=parseFloat(s.value);show();}); }
bind('float','float',x=>x.toFixed(2)); bind('grav','grav',x=>Math.round(x)); bind('flap','flap',x=>Math.round(x));
bind('climb','maxUp',x=>Math.round(x)); bind('side','side',x=>Math.round(x));
bind('hit','hit',x=>Math.round(R*x)+'px');
let DEBUG=false; document.getElementById('dbg').addEventListener('change',e=>{ DEBUG=e.target.checked; });

// ---------- title / result screens ----------
function startGame(m){
  mode=m;
  document.getElementById('title').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  resetAll(); phase='playing'; started=true; BGM.start(); fadeHint();
  updateModeStat();
}
document.querySelectorAll('.modeBtn').forEach(btn=>{
  btn.addEventListener('click',()=>startGame(btn.dataset.mode));
});

function finishGame(){
  if(phase!=='playing') return;
  phase='result';
  const mm=Math.floor(elapsed/60), ss=Math.floor(elapsed%60);
  document.getElementById('r_score').textContent=score;
  document.getElementById('r_count').textContent=banked;
  document.getElementById('r_time').textContent=mm+':'+String(ss).padStart(2,'0');
  const rTitle=document.getElementById('r_title'), bestEl=document.getElementById('r_best');
  let bestText='';
  if(mode==='stage'){
    rTitle.textContent='ステージクリア！';
    const key='lovot_best_stage_time', prevBest=parseFloat(localStorage.getItem(key));
    if(isNaN(prevBest) || elapsed<prevBest){ localStorage.setItem(key,elapsed);
      bestText='🎉 ベスト更新！ '+mm+':'+String(ss).padStart(2,'0'); }
    else{ const bm=Math.floor(prevBest/60), bs=Math.floor(prevBest%60);
      bestText='自己ベスト: '+bm+':'+String(bs).padStart(2,'0'); }
  } else if(mode==='time'){
    rTitle.textContent='タイムアップ！';
    const key='lovot_best_time_score', prevBest=parseInt(localStorage.getItem(key)||'0',10);
    if(score>prevBest){ localStorage.setItem(key,score); bestText='🎉 ベスト更新！ '+score; }
    else bestText='自己ベスト: '+prevBest;
  }
  bestEl.textContent=bestText;
  document.getElementById('result').classList.remove('hidden');
}
document.getElementById('r_retry').addEventListener('click',()=>startGame(mode));
document.getElementById('r_toTitle').addEventListener('click',()=>{
  document.getElementById('result').classList.add('hidden');
  phase='title'; started=false;
  document.getElementById('title').classList.remove('hidden');
});

resize(); resetAll(); requestAnimationFrame(tick);
</script>
